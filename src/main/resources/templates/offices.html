<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offices</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { color: #2c3e50; }
        .search-form { margin-bottom: 20px; }
        .search-form input[type="text"] { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        .search-form button { padding: 8px 16px; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-form button:hover { background: #1a6fa0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; border: 1px solid #ddd; text-align: left; }
        th { background: #2c3e50; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #c0392b; }
        .btn-update { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 6px; }
        .btn-update:hover { background: #d68910; }
        .msg { margin-bottom: 16px; padding: 10px; border-radius: 4px; }
        .msg.success { background: #d4edda; color: #155724; }
        .msg.error { background: #f8d7da; color: #721c24; }
        .no-results { color: #888; font-style: italic; }
    </style>
</head>
<body>

<h2>All Offices</h2>

<!-- Flash messages -->
<div th:if="${successMsg}" class="msg success" th:text="${successMsg}"></div>
<div th:if="${errorMsg}" class="msg error" th:text="${errorMsg}"></div>

<!-- Search Form -->
<form class="search-form" method="get" th:action="@{/api/office/offices}">
    <input type="text" name="keyword" placeholder="Search by name or office number..." th:value="${keyword}" />
    <button type="submit">Search</button>
    <a th:href="@{/api/office/offices}" style="margin-left:10px; color:#2980b9;">Clear</a>
</form>

<!-- Offices Table -->
<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Office Name</th>
            <th>Office Number</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${#lists.isEmpty(offices)}">
            <td colspan="4" class="no-results">No offices found.</td>
        </tr>
        <tr th:each="office, stat : ${offices}">
            <td th:text="${stat.count}"></td>
            <td th:text="${office.name}"></td>
            <td th:text="${office.officeNumber}"></td>
            <td>
                <button class="btn-update" disabled>Update</button>
                <form method="post" th:action="@{/api/office/offices/delete/{id}(id=${office.id})}" style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this office?');">
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
